<html>
  <head>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev",
          "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime?dev"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/babel" data-type="module" data-presets="react">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      const domNode = document.getElementById('app');

      function Head(props){
        return <h1>{props.status == "cool" ? `${props.status} web` : "not cool"}</h1>
      }
      function HomePage(){ 
        return (
          <div>
          <Head status = "cool"/>
          <Head status = "not"/>
          </div>
        )
      }
      const root = createRoot(domNode);
      root.render(<h2>Develop. Preview. Ship.</h2>);
      root.render(<HomePage />);
     document.body.style.background = "rgb(50, 50, 50)";
    document.body.style.color = "white"
    </script>
  </body>
</html>
